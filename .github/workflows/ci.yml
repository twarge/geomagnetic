name: CI

# Build checks on every push/PR and when reused as a release prerequisite.
# Unsigned (ephemeral runners have no signing identity); distribution builds
# are signed by the App Store workflow instead.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The xcode-27 image defaults to Xcode 27.0. Build with 27.1, the Xcode the
# app is developed on, so CI compiles against the same SDKs.
env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            scheme: Observatory
            destination: generic/platform=macOS
          - name: iOS
            scheme: Observatory
            destination: generic/platform=iOS Simulator
          - name: watchOS
            scheme: ObservatoryWatch
            destination: generic/platform=watchOS Simulator
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild build \
            -project Geomagnetic.xcodeproj \
            -scheme '${{ matrix.scheme }}' \
            -configuration Release \
            -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO
